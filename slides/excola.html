<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colinha · Aula experimental</title><style>:root{--head:Georgia,'Times New Roman',serif;--body:Calibri,'Segoe UI',Arial,sans-serif;--blue:#1F5FBF;--ink:#1B2433;--mute:#5B6577;--soft:#E8F0FC}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0f1724;font-family:var(--body);overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:960px;height:540px;transform-origin:center}
.slide{position:absolute;inset:0;overflow:hidden;display:none;color:var(--ink);background:#FAFBFD}
.slide.on{display:block;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1}}
.stripe{position:absolute;left:0;top:0;width:17px;height:540px;background:var(--blue)}
h2{margin:0;position:absolute;left:58px;top:30px;width:620px;font:700 35px var(--head)}
.sub{position:absolute;left:58px;top:80px;font-size:14px;color:var(--mute)}
.tag{position:absolute;right:48px;top:38px;width:240px;text-align:right;font-size:13px;font-weight:700;color:var(--blue)}
.kick{position:absolute;right:48px;top:58px;width:260px;text-align:right;font-size:11px;font-weight:700;letter-spacing:3px;color:#9AA7BD}
.say{position:absolute;left:58px;top:112px;width:500px;height:312px;background:var(--soft);border-radius:10px;padding:16px 22px}
.say b,.r b{display:block;color:var(--blue);font-size:14px;letter-spacing:3px;margin-bottom:4px}
.say p{margin:12px 0 0;font:italic 19px/1.38 var(--head)}
.r{position:absolute;left:578px;width:324px;height:96px;background:var(--soft);border-radius:10px;padding:10px 16px;font-size:14.5px;line-height:1.3}
.r b{font-size:13px;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.br{position:absolute;left:58px;right:58px;top:440px;height:62px;background:var(--blue);color:#fff;border-radius:10px;padding:0 22px;display:flex;align-items:center;gap:18px;font:italic 19px var(--head)}
.br em{flex:none;font:700 13px var(--body);letter-spacing:3px;color:#CFE0FB;font-style:normal}
#bar{position:fixed;left:0;right:0;top:0;height:4px;background:#ffffff22}#prog{height:100%;width:0;background:#4f8df0;transition:width .3s}
#hud{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;color:#fff;font-size:14px;background:#0008;padding:6px 10px;border-radius:20px;opacity:.25;transition:.2s;white-space:nowrap}
#hud:hover{opacity:1}#hud button{background:#1F5FBF;color:#fff;border:0;border-radius:14px;padding:4px 12px;cursor:pointer;font-size:14px}
@media print{#hud,#bar{display:none}}</style></head><body>
<div id="stage"></div>
<div id="bar"><div id="prog"></div></div>
<div id="hud"><button id="prev" aria-label="Anterior">‹</button><span id="count"></span><button id="next" aria-label="Próximo">›</button><button id="fbtn">Tela cheia (F)</button></div>
<script>
const P=[
["1 min · Abertura","Abertura","Let’s Start Speaking English!",
["Oi! Que bom que você chegou. Respira e fica à vontade, aqui ninguém vai te julgar.","Em 20 minutinhos você vai se apresentar em inglês, de verdade, e sair daqui com frases que já dá pra usar amanhã.","Eu falo pouco e você fala muito. Bora?"],
[["Tom","Voz calma, ritmo devagar, sorriso. Quem fala tranquilo deixa o outro tranquilo."],["Promessa","Prometa só o que a aula entrega: se apresentar e se virar numa conversa simples. Nada de fluência."],["Se travar","Fale você primeiro, mais um pouco. Silêncio no começo é normal, não force."]],
"Antes dos slides: me conta, o que te trouxe até aqui?"],
["0–2 min · Descoberta","Acolhimento","Welcome!",
["O que te fez querer começar agora? Pode ser em português, sem pressa.","E em que situação você mais sente falta do inglês: trabalho, viagem, conversa?","De 1 a 5, quão confiante você está pra falar inglês hoje? Combinado: a meta de hoje é você se apresentar."],
[["Anote tudo","Palavras exatas dela: motivo, situação e nota de confiança. É a sua munição pro fechamento."],["Escuta","Devolva a palavra-chave: “Então é pra viagem?” Ela sente que foi ouvida."],["Cuidado","Não prometa fluência nem prazo. Foque no que ela vai conseguir fazer hoje."]],
"Perfeito! Vou montar a aula em volta disso. Vamos aquecer?"],
["2–6 min · Avaliação informal","Avaliação informal","Let’s Talk: Warm-up Questions",
["Vou te fazer umas perguntinhas, tá? Não é prova, é só pra eu conhecer o seu inglês.","Se não entender, pode dizer “repeat, please”. Eu repito quantas vezes precisar."],
[["Como ouvir","Resposta de uma palavra = nível 1. Frases com because = nível 3. Guarde pra você."],["Elogio específico","“Você entendeu sem traduzir!” Prova real vale mais que “muito bem”. Ela pensa: eu consigo."],["Se travar","Dê duas opções (“coffee or tea?”) e só depois pergunte “why?”."]],
"Gostei! Agora vou te dar as frases pra você se apresentar."],
["6–9 min · Apresentação","Apresentação","Introducing Yourself",
["Eu falo, você repete. Duas vezes, sem vergonha, pode até exagerar!","Agora troca o que está nas reticências pelo seu jeito. Vai ser a sua frase, a sua história.","Olha só: você acabou de se apresentar em inglês."],
[["Primeira vitória","Quando ela completar a 1ª frase real, pare e celebre. Anote a melhor frase dela pro fechamento."],["Pronúncia","Corrija um som por vez. Repita a frase certa de forma natural, sem apontar o erro."],["Se travar","Você pergunta, ela só completa o pedacinho novo. Já é conversa."]],
"E se esquecer uma palavra? Tenho um truque pra isso."],
["9–11 min · Rede de segurança","Rede de segurança","When You Don’t Know the Word",
["Esse é o bloco mais importante da aula. Quem sabe pedir ajuda nunca fica perdido.","Vou falar rápido de propósito. Aí você me ajuda com uma dessas frases.","Viu? Você não precisa saber tudo. Só precisa saber o que fazer quando não sabe."],
[["Encenação","Fale rápido de propósito. Depois finja que esqueceu uma palavra e peça ajuda você também."],["Gancho","Diga: “Nas aulas a gente treina isso até virar automático.” Planta a semente do plano."],["Elogio","Comemore cada uso: “Perfeito, foi exatamente isso!” Reforço vira hábito."]],
"Agora vamos juntar tudo num diálogo."],
["11–14 min · Diálogo guiado","Diálogo guiado","Meeting Someone New",
["Primeiro eu leio e você só escuta. Depois a gente repete em pedacinhos.","Agora trocamos: você faz um lado, eu faço o outro.","Última rodada: sem olhar o texto, com a sua história de verdade."],
[["Ritmo","Quatro rodadas curtas: ouvir, repetir, trocar de papel, improvisar. Cansou? Vá direto pro improviso."],["Ponte pro plano","No fim: “Isso já é uma conversa real. Em 20 minutos! Imagina com 1 mês de prática.”"],["Se travar","Ela só lê as falas dela. Já conta como vitória, comemore."]],
"Chegou a hora de conversar sem roteiro."],
["14–16 min · Conversa real","Conversa real","Your Turn: Real Conversation",
["Agora esquece que isso é uma aula. Imagina que a gente se conheceu num café.","Escolhe uma pergunta e responde do jeito que der. Faltou palavra? Você já sabe o que fazer."],
[["Gancho de venda","A 1ª pergunta traz o motivo real dela. Anote com as palavras dela: é o seu argumento no fechamento."],["Reação","Reaja como gente: “Nossa, sério?” Não interrompa e anote só os erros que se repetem."],["Se travar","Comece a frase por ela (“I started because…”) e deixe ela terminar."]],
"Pra fechar, um mini desafio só seu."],
["16–18 min · Desafio final","Desafio final","Speaking Challenge",
["Você tem 30 segundinhos pra pensar. Usa os passos como um mapa.","Eu só escuto e aplaudo. Pode errar à vontade.","Você acabou de falar quase um minuto em inglês, sem traduzir. Como se sentiu?"],
[["Deixe sentir","Faça a pergunta final e CALE-SE. Ela precisa sentir a vitória antes de você falar de plano."],["Feedback","Primeiro 3 acertos, depois no máximo 2 correções. Repita a frase certa sem dar bronca."],["Se travar","Três frases bastam. Diga: “Isso já é uma apresentação completa!”"]],
"Vamos ver tudo o que você conseguiu hoje?"],
["18–20 min · Fechamento","Fechamento","Great Job! What Next?",
["Você me disse que queria [objetivo dela]. Hoje você já falou [frase dela]. Lá no início era [nota] de 5, e agora?","O melhor caminho pra você é 1 aula por semana, 50 minutos. Com prática, em 4 a 6 aulas a maioria fala de passado, presente e futuro simples.","Quer que eu reserve o seu horário fixo dessa semana?"],
[["Passo a passo","1) Ela diz o que aprendeu. 2) Nota de 1 a 5 de novo. 3) Devolva as palavras dela. 4) Proposta. 5) Pergunta e CALE-SE."],["Objeções","“Vou pensar”: o que falta avaliar, horário, valor ou método? “Sem tempo”: por isso 1 aula + áudio de 1 min."],["Honestidade","Estimativa, nunca garantia. Se houver condição de hoje, diga agora. Marque dia e hora na aula."]],
"Valeu por hoje! Foi muito bom conversar com você. See you soon!"]
];
const $=id=>document.getElementById(id),st=$('stage');
st.innerHTML=P.map((p,n)=>`<section class="slide"><div class="stripe"></div><h2>${p[1]}</h2><div class="sub">Slide ${n+1} · ${p[2]}</div><div class="tag">${p[0]}</div><div class="kick">COLINHA · SÓ VOCÊ VÊ</div><div class="say"><b>FALE ASSIM</b>${p[3].map(t=>`<p>“${t}”</p>`).join('')}</div>${p[4].map((r,k)=>`<div class="r" style="top:${112+k*108}px"><b>${r[0]}</b>${r[1]}</div>`).join('')}<div class="br"><em>${n==P.length-1?'FECHAMENTO':'PONTE →'}</em>${p[5]}</div></section>`).join('');
const S=[...document.querySelectorAll('.slide')];let i=0;try{i=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1))}catch(e){}
function fit(){const k=Math.min(innerWidth/960,innerHeight/540);st.style.transform=`translate(-50%,-50%) scale(${k})`}
function show(n){i=Math.max(0,Math.min(S.length-1,n));S.forEach((s,k)=>s.classList.toggle('on',k===i));$('count').textContent=`${i+1} / ${S.length}`;$('prog').style.width=(i+1)/S.length*100+'%';try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
function full(){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
$('prev').onclick=()=>show(i-1);$('next').onclick=()=>show(i+1);$('fbtn').onclick=full;
addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(i+1)}else if(['ArrowLeft','PageUp'].includes(e.key))show(i-1);else if(e.key==='Home')show(0);else if(e.key==='End')show(S.length-1);else if(e.key.toLowerCase()==='f')full()});
addEventListener('resize',fit);fit();show(i);
</script></body></html>
